name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    # Linux only, deliberately: it is what we deploy on, so it is the platform whose behaviour
    # has to be green. Developer machines are Windows, which means Windows-only breakage surfaces
    # locally the moment it is introduced — a second runner would bill 2x Linux minutes on an
    # internal repo to gate something already exercised every day.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives each package's version from tag history, which a shallow clone lacks.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # No feed credentials anywhere in this job: sibling libraries build from source
      # (UseProjectReferences defaults to true), and package source mapping means no Cyclotron.*
      # package is ever requested. That also lets this run on pull requests from forks.
      - run: dotnet restore CyclotronAzure.Libraries.sln

      - run: dotnet build CyclotronAzure.Libraries.sln -c Release --no-restore

      - run: dotnet test CyclotronAzure.Libraries.sln -c Release --no-build --verbosity normal
