name: release

# One workflow releases every package in the repo. The tag names which one, so adding a package
# never means adding a workflow. Tag format: <PackageId>-v<Version>, e.g. Cyclotron.Graph.Core-v0.0.2
on:
  push:
    tags:
      - 'Cyclotron.*-v*'
  # Manual re-run of an EXISTING tag — for when a release run failed after the tag was pushed.
  # The tag stays the source of truth: this never invents a version, it rebuilds one already cut.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. Cyclotron.Graph.Core-v0.0.2'
        required: true
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  FEED: https://nuget.pkg.github.com/cyclotron-azure/index.json

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # On a manual run, check out the tag that was named rather than the default branch.
          ref: ${{ inputs.tag || github.ref }}
          # MinVer must see the tag history to resolve this package's version.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Identify the package from the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^Cyclotron\.[A-Za-z0-9.]+-v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::'$TAG' is not a release tag. Expected <PackageId>-v<Version>, e.g. Cyclotron.Graph.Core-v0.0.2"
            exit 1
          fi
          echo "PACKAGE_ID=${TAG%-v*}" >> "$GITHUB_ENV"
          echo "VERSION=${TAG##*-v}" >> "$GITHUB_ENV"
          echo "Releasing ${TAG%-v*} ${TAG##*-v}"

      - name: Locate the project
        run: |
          PROJECT=$(find . -path "*/src/${PACKAGE_ID}/${PACKAGE_ID}.csproj")
          if [ "$(printf '%s' "$PROJECT" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected exactly one project for ${PACKAGE_ID}, found: ${PROJECT:-<none>}"
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      # Sibling libraries build from source here, so a Core change is validated against Mail's
      # tests before anything ships — the same reason CI tests the solution rather than a package.
      - name: Build and test the whole repo
        run: |
          dotnet restore CyclotronAzure.Libraries.sln
          dotnet build CyclotronAzure.Libraries.sln -c Release --no-restore
          dotnet test CyclotronAzure.Libraries.sln -c Release --no-build --verbosity normal

      # Restoring a published sibling (Mail depends on the released Core) needs the feed, so
      # credentials go in before packing — not only before pushing.
      - name: Authenticate the GitHub Packages source
        run: dotnet nuget update source github --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --configfile nuget.config

      # UseProjectReferences=false so the shipped package depends on the PUBLISHED sibling pinned
      # in Directory.Packages.props, not on whatever version this build computed for it.
      - name: Pack
        run: dotnet pack "$PROJECT" -c Release -o artifacts -p:UseProjectReferences=false

      # If MinVer resolved something other than the tag, the expected file is simply absent —
      # catches a malformed tag or a misconfigured prefix before anything reaches the feed.
      - name: Verify the packed version matches the tag
        run: |
          EXPECTED="artifacts/${PACKAGE_ID}.${VERSION}.nupkg"
          if [ ! -f "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED but pack produced: $(ls artifacts)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_ID }}-${{ env.VERSION }}
          path: artifacts/*

      # Only the tagged package is pushed. Nothing else in the repo is republished.
      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/${PACKAGE_ID}.${VERSION}.nupkg" --source "$FEED" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
