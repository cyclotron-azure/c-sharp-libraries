name: publish

on:
  push:
    branches: [main]
    tags:
      - 'Cyclotron.*-v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  FEED: https://nuget.pkg.github.com/cyclotron-azure/index.json

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives each package's version from tag history, which a shallow clone lacks.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Needed to RESTORE published sibling packages (Mail depends on the released
      # Cyclotron.Graph.Core), not only to push.
      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source "$FEED" \
            --name github \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text

      # Sibling libraries compile against each other's SOURCES here, so a change to Core is
      # validated against Mail's tests before either is released.
      - name: Build and test
        run: |
          dotnet restore CyclotronAzure.Libraries.sln
          dotnet build CyclotronAzure.Libraries.sln -c Release --no-restore
          dotnet test CyclotronAzure.Libraries.sln -c Release --no-build --verbosity normal

      # Shipped packages depend on the PUBLISHED sibling pinned in Directory.Packages.props,
      # so this pass restores and builds again with the package reference in place.
      - name: Pack
        run: dotnet pack CyclotronAzure.Libraries.sln -c Release -o artifacts -p:UseProjectReferences=false

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

      # Commits on main publish prereleases for every package; a package's own tag publishes its
      # stable version. Packages not being released still push a prerelease, which is harmless —
      # --skip-duplicate makes re-runs idempotent.
      - name: Push to GitHub Packages
        if: github.event_name != 'pull_request'
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source "$FEED" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
